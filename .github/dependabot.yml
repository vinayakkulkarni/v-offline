version: 2
updates:
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: '/'
    # TypeScript 7 is held: vue-tsc and vp pack need the TypeScript 7.1
    # API. Remove this ignore when both support TypeScript 7.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    reviewers:
      - vinayakkulkarni
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: '/example'
    # Same TypeScript 7 hold as the root entry above.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    reviewers:
      - vinayakkulkarni
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - vinayakkulkarni
    assignees:
      - vinayakkulkarni
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
